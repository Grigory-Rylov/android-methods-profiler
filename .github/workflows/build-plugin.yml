name: Build and Release Plugin

on:
  pull_request:
    types: [closed]
    branches:
      - master

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build plugin
        run: |
          ./gradlew :plugin:buildPlugin \
            -x :app:test \
            -x :app:compileTestKotlin \
            --no-daemon

      - name: Get version from gradle.properties
        id: get_version
        run: |
          version=$(grep 'yampVersion' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rename plugin artifact
        run: |
          mv plugin/build/distributions/*.zip plugin/build/distributions/yamp_plugin_${{ steps.get_version.outputs.version }}.zip

      - name: Check release tag
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.get_version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git tag v${{ steps.get_version.outputs.version }}
          git push origin v${{ steps.get_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip release when tag already exists
        if: steps.tag_check.outputs.exists == 'true'
        run: |
          echo "::warning::Tag v${{ steps.get_version.outputs.version }} already exists; skipping plugin release. Bump yampVersion in gradle.properties to publish a new version."

      - name: Create GitHub Release
        id: create_release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload plugin artifact to release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: plugin/build/distributions/yamp_plugin_${{ steps.get_version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
